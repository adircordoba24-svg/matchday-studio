<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>MATCHDAY STUDIO | ניהול הזמנות</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230a0f1c'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%23d6b06a' stroke-width='2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" defer></script>
<style>
*{box-sizing:border-box}
:root{--bg:#0a0f1c;--surface:#111a2b;--field:#0a1222;--ink:#f4efe3;--muted:#aeb3bf;--accent:#d6b06a;--accent-ink:#1a1306;--line:rgba(214,176,106,.28);
  --new:#6ea8ff;--progress:#d6b06a;--done:#6fcf97;--cancelled:#8b93a3;color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 'Heebo',Arial,sans-serif}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
button,select{font:inherit}
.btn{border:0;border-radius:6px;background:var(--accent);color:var(--accent-ink);font-weight:700;padding:11px 18px;cursor:pointer;text-decoration:none;display:inline-block;font-size:15px;line-height:1.2}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:#ff8f8f;border:1px solid #ff8f8f66}
.btn[disabled]{opacity:.55;cursor:wait}

header.top{border-bottom:1px solid var(--line);padding:16px 0}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.brand{font-weight:700;letter-spacing:.26em;font-size:14px;direction:ltr}
.who{display:flex;align-items:center;gap:12px;font-size:14px;color:var(--muted)}
.who bdi{direction:ltr}

.card{margin:40px auto;max-width:520px;padding:36px 30px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-align:center}
.card h1{font-size:26px;margin:0 0 10px}
.card p{color:var(--muted);margin:0 0 22px}
.card .err{color:#ff8f8f;white-space:pre-line}
.notice{margin:20px 0;padding:14px 18px;border:1px solid #ff8f8f66;border-radius:8px;color:#ffb4b4;white-space:pre-line}

.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:22px 0 14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:99px;padding:7px 14px;cursor:pointer;font-size:14px}
.chip[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tools .btn{padding:8px 14px;font-size:14px}
.tools select{background:var(--field);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:14px}
.when{display:inline-block;margin-inline-start:8px;font-size:12px;font-weight:700;padding:1px 9px;border-radius:99px;border:1px solid currentColor;color:var(--muted)}
.when.soon{color:#ffb86b}.when.urgent{color:#ff8f8f}

.orders{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;padding-bottom:60px}
.empty{padding:50px 0;text-align:center;color:var(--muted)}
details.order{border:1px solid var(--line);border-radius:10px;background:var(--surface)}
details.order.is-new{border-color:var(--new)}
details.order>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:1.2fr 1.6fr 1fr auto;gap:12px;align-items:center;padding:14px 16px}
details.order>summary::-webkit-details-marker{display:none}
.o-main b{font-size:18px}
.o-main .num{color:var(--accent);margin-inline-start:6px;font-weight:700}
.o-sub{color:var(--muted);font-size:14px}
.badge{font-size:13px;font-weight:700;padding:3px 12px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.st-new{color:var(--new)}.st-progress{color:var(--progress)}.st-done{color:var(--done)}.st-cancelled{color:var(--cancelled)}
.o-body{padding:4px 16px 18px;border-top:1px solid var(--line)}
dl{margin:14px 0;display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px 18px}
dt{color:var(--muted);font-size:14px}
dd{margin:0;overflow-wrap:anywhere}
dd.ltr{direction:ltr;text-align:right}
.ok{color:var(--done)}.warn{color:#ffb86b}
.photos{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0 14px;min-height:30px}
.photos a{display:block}
.photos img{height:150px;width:auto;border-radius:6px;border:1px solid var(--line);display:block;background:var(--field)}
.photos .loading{color:var(--muted);font-size:14px}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:6px}
.actions select{background:var(--field);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:9px 10px}
.actions .grow{flex:1}
details.prompt{margin-top:14px;border:1px solid var(--line);border-radius:8px}
details.prompt summary{cursor:pointer;padding:10px 14px;font-size:14px;color:var(--muted)}
details.prompt pre{margin:0;padding:12px 14px;white-space:pre-wrap;overflow-wrap:anywhere;direction:rtl;text-align:right;font:13px/1.55 ui-monospace,Menlo,Consolas,monospace;color:#d9dbe2;border-top:1px solid var(--line);max-height:380px;overflow:auto}
.toast{position:fixed;bottom:20px;inset-inline-start:50%;transform:translateX(50%);background:var(--accent);color:var(--accent-ink);font-weight:700;padding:10px 20px;border-radius:99px;z-index:20}

@media (max-width:760px){
  details.order>summary{grid-template-columns:1fr auto;grid-template-areas:"main badge" "sub sub" "date date"}
  .o-main{grid-area:main}.o-sub{grid-area:sub}.o-date{grid-area:date}.badge{grid-area:badge}
  dl{grid-template-columns:minmax(0,1fr)}
  dt{margin-top:8px}
}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <span class="brand">MATCHDAY / STUDIO</span>
    <div class="who" id="who" hidden>
      <bdi id="whoEmail"></bdi>
      <button class="btn ghost" id="signOut" type="button">התנתקות</button>
    </div>
  </div>
</header>

<main class="wrap">

  <section class="card" id="setupCard" hidden>
    <h1>האתר עדיין לא מחובר</h1>
    <p>צריך למלא את פרטי Firebase בקובץ <bdi dir="ltr">firebase-config.js</bdi>. כל השלבים מפורטים בקובץ <bdi dir="ltr">SETUP.md</bdi>.</p>
  </section>

  <section class="card" id="loginCard" hidden>
    <h1>ניהול הזמנות</h1>
    <p>הכניסה מותרת לבעל העסק בלבד.</p>
    <button class="btn" id="signIn" type="button">כניסה עם Google</button>
    <p class="err" id="loginErr" role="alert" style="margin-top:18px"></p>
  </section>

  <section id="app" hidden>
    <div class="toolbar">
      <div class="chips" id="chips" role="group" aria-label="סינון לפי סטטוס"></div>
      <div class="tools">
        <label class="sr" for="sortSel">מיון הזמנות</label>
        <select id="sortSel">
          <option value="game">מיון: לפי תאריך המשחק</option>
          <option value="new">מיון: הכי חדשות</option>
        </select>
        <button class="btn ghost" id="alertsBtn" type="button">הפעלת התראות</button>
      </div>
    </div>
    <div class="notice" id="appErr" hidden role="alert"></div>
    <div class="orders" id="orders" aria-live="polite"></div>
  </section>
</main>

<script type="module">
import { loadDb, loadAuth, isConfigured } from '../js/firebase-init.js';
import { SITE } from '../firebase-config.js';
import { STATUSES, STYLES, LAYOUTS, BROADCASTS, byId } from '../js/data.js';
import { buildDetails, fmtDate } from '../js/prompt.js';
import { buildPrompt, logoInfo } from '../js/prompts.js';

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
// כל טקסט שהלקוח כתב עובר esc() לפני שהוא נכנס ל-HTML, כדי שאף לקוח לא יוכל להריץ קוד בדף הניהול.

const state = { orders: new Map(), sort: (() => { try { return localStorage.getItem('md_sort') === 'new' ? 'new' : 'game'; } catch (_) { return 'game'; } })(), filter: 'all', open: new Set(), photos: new Map(), first: true, db: null, fs: null };
const ADMIN = String(SITE.adminEmail || '').toLowerCase();

/* ---------- מסכים ---------- */
function show(which) {
  ['setupCard', 'loginCard', 'app'].forEach((id) => { $('#' + id).hidden = id !== which; });
}
function toast(text) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = text;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2200);
}

/* ---------- התחברות ---------- */
async function init() {
  if (!isConfigured()) { show('setupCard'); return; }
  let au, auth;
  try { ({ au, auth } = await loadAuth()); }
  catch (e) { show('loginCard'); $('#loginErr').textContent = 'לא הצלחנו לטעון את שירות ההתחברות.'; return; }

  $('#signIn').addEventListener('click', async () => {
    $('#loginErr').textContent = '';
    const provider = new au.GoogleAuthProvider();
    provider.setCustomParameters({ prompt: 'select_account' });
    try { await au.signInWithPopup(auth, provider); }
    catch (e) {
      console.error(e);
      if (e.code === 'auth/popup-blocked') { await au.signInWithRedirect(auth, provider); return; }
      if (e.code === 'auth/unauthorized-domain') $('#loginErr').textContent = 'הדומיין של האתר לא מורשה ב-Firebase. צריך להוסיף אותו ב-Authentication > Settings > Authorized domains.';
      else if (e.code === 'auth/operation-not-allowed') $('#loginErr').textContent = 'כניסה עם Google לא מופעלת ב-Firebase (קוד: operation-not-allowed).';
      else if (e.code !== 'auth/popup-closed-by-user' && e.code !== 'auth/cancelled-popup-request') $('#loginErr').textContent = 'ההתחברות נכשלה. נסו שוב. (קוד: ' + (e.code || 'unknown') + ')';
    }
  });
  $('#signOut').addEventListener('click', () => au.signOut(auth));

  au.onAuthStateChanged(auth, async (user) => {
    if (!user) { $('#who').hidden = true; stopOrders(); show('loginCard'); return; }
    const ok = user.emailVerified && String(user.email || '').toLowerCase() === ADMIN;
    if (!ok) {
      await au.signOut(auth);
      show('loginCard');
      $('#loginErr').textContent = 'לחשבון הזה אין הרשאת כניסה. התחברו עם המייל של בעל העסק.';
      return;
    }
    $('#whoEmail').textContent = user.email;
    $('#who').hidden = false;
    show('app');
    startOrders();
  });
}

/* ---------- הזמנות בזמן אמת ---------- */
let unsub = null;
async function startOrders() {
  if (unsub) return;
  try {
    const { fs, db } = await loadDb();
    state.fs = fs; state.db = db; state.first = true;
    const q = fs.query(fs.collection(db, 'orders'), fs.orderBy('createdAt', 'desc'), fs.limit(300));
    unsub = fs.onSnapshot(q, (snap) => {
      $('#appErr').hidden = true;
      const added = [];
      snap.docChanges().forEach((c) => { if (c.type === 'added') added.push(c.doc.data()); });
      state.orders = new Map(snap.docs.map((d) => [d.id, { id: d.id, ...d.data() }]));
      render();
      if (!state.first && added.length) notifyNew(added);
      state.first = false;
    }, (err) => {
      console.error(err);
      const box = $('#appErr');
      box.hidden = false;
      box.textContent = err.code === 'permission-denied'
        ? 'אין הרשאת קריאה. בדקו ש-firestore.rules פורסם ושהמייל בו זהה למייל שאיתו התחברתם.'
        : 'שגיאה בטעינת ההזמנות. נסו לרענן את הדף.';
    });
  } catch (e) { console.error(e); }
}
function stopOrders() { if (unsub) { unsub(); unsub = null; } state.orders = new Map(); }

/* ---------- התראות ---------- */
let audio;
function beep() {
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const o = audio.createOscillator(), g = audio.createGain();
    o.connect(g); g.connect(audio.destination);
    o.frequency.value = 880;
    g.gain.setValueAtTime(0.18, audio.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + 0.6);
    o.start(); o.stop(audio.currentTime + 0.6);
  } catch (_) {}
}
function notifyNew(list) {
  if (localStorage.getItem('md_alerts') !== '1') return;
  beep();
  if ('Notification' in window && Notification.permission === 'granted') {
    const o = list[0];
    new Notification('הזמנה חדשה', { body: `${o.player} · ${o.team} נגד ${o.opponent}` });
  }
}
function syncAlertsBtn() {
  const on = localStorage.getItem('md_alerts') === '1';
  $('#alertsBtn').textContent = on ? 'התראות פעילות ✓' : 'הפעלת התראות';
}
$('#alertsBtn').addEventListener('click', async () => {
  if (localStorage.getItem('md_alerts') === '1') { localStorage.removeItem('md_alerts'); syncAlertsBtn(); return; }
  localStorage.setItem('md_alerts', '1');
  beep(); // נדרש מגע של המשתמש כדי שהדפדפן יאפשר צליל
  if ('Notification' in window && Notification.permission === 'default') await Notification.requestPermission();
  syncAlertsBtn();
  toast('התראות הופעלו. הן עובדות כל עוד הדף פתוח.');
});
syncAlertsBtn();

/* ---------- תצוגה ---------- */
function statusLabel(id) { return (byId(STATUSES, id) || { he: id }).he; }
function fmtCreated(o) {
  const d = o.createdAt && o.createdAt.toDate ? o.createdAt.toDate() : null;
  return d ? d.toLocaleString('he-IL', { dateStyle: 'short', timeStyle: 'short' }) : '';
}

function gameTime(o) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(o.date || '');
  if (!m) return null;
  const t = /^(\d{2}):(\d{2})$/.exec(o.time || '') || [0, '00', '00'];
  return new Date(+m[1], +m[2] - 1, +m[3], +t[1], +t[2]);
}
const createdMs = (o) => (o.createdAt && o.createdAt.toDate ? o.createdAt.toDate().getTime() : 0);
function sortOrders(list) {
  if (state.sort === 'new') return list.sort((a, b) => createdMs(b) - createdMs(a));
  const now = Date.now() - 3 * 3600e3; // משחק שהתחיל לפני יותר מ-3 שעות נחשב שעבר
  const key = (o) => { const d = gameTime(o); return d ? d.getTime() : Infinity; };
  const upcoming = list.filter((o) => key(o) >= now).sort((a, b) => key(a) - key(b));
  const past = list.filter((o) => key(o) < now).sort((a, b) => key(b) - key(a));
  return [...upcoming, ...past];
}
function whenBadge(o) {
  const g = gameTime(o);
  if (!g || o.status === 'done' || o.status === 'cancelled') return '';
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const day = new Date(g); day.setHours(0, 0, 0, 0);
  const n = Math.round((day - today) / 86400000);
  if (n < 0) return '<span class="when">עבר</span>';
  if (n === 0) return '<span class="when urgent">היום</span>';
  if (n === 1) return '<span class="when urgent">מחר</span>';
  if (n === 2) return '<span class="when urgent">מחרתיים</span>';
  if (n <= 7) return `<span class="when soon">בעוד ${n} ימים</span>`;
  return '';
}

function renderChips() {
  const counts = { all: state.orders.size };
  STATUSES.forEach((s) => { counts[s.id] = 0; });
  state.orders.forEach((o) => { counts[o.status] = (counts[o.status] || 0) + 1; });
  const defs = [{ id: 'all', he: 'הכול' }, ...STATUSES];
  $('#chips').innerHTML = defs.map((d) =>
    `<button type="button" class="chip" data-filter="${d.id}" aria-pressed="${state.filter === d.id}">${esc(d.he)} (${counts[d.id] || 0})</button>`).join('');
  document.title = (counts.new ? `(${counts.new}) ` : '') + 'MATCHDAY STUDIO | ניהול הזמנות';
}

function orderHTML(o) {
  const open = state.open.has(o.id);
  const style = byId(STYLES, o.styleId);
  const layout = byId(LAYOUTS, o.photoLayout);
  const bc = o.broadcast === 'yes' ? `יש שידור (${esc(o.broadcastChannel)})` : 'אין שידור';
  const L = logoInfo(o);
  const lg = (x) => x.file ? `<span class="ok">נמצא</span> <bdi dir="ltr">${esc(x.file)}.png</bdi>` : '<span class="warn">לא נמצא קובץ. הסוכן יחפש לפי שם</span>';
  const wa = `https://wa.me/972${esc(String(o.contact || '').replace(/^0/, ''))}?text=${encodeURIComponent(`שלום ${o.player}, מדבר מ-MATCHDAY STUDIO. קיבלתי את ההזמנה שלך לפוסטר (${o.team} נגד ${o.opponent}).`)}`;
  const ref = o.id.slice(0, 6).toUpperCase();
  return `<details class="order ${o.status === 'new' ? 'is-new' : ''}" data-id="${esc(o.id)}" ${open ? 'open' : ''}>
    <summary>
      <span class="o-main"><b>${esc(o.player)}</b>${o.number ? `<span class="num">#${esc(o.number)}</span>` : ''}</span>
      <span class="o-sub">${esc(o.team)} נגד ${esc(o.opponent)}</span>
      <span class="o-sub o-date">משחק: ${esc(fmtDate(o.date))} ${esc(o.time)}${whenBadge(o)}</span>
      <span class="badge st-${esc(o.status)}">${esc(statusLabel(o.status))}</span>
    </summary>
    <div class="o-body">
      <dl>
        <dt>מספר הזמנה</dt><dd class="ltr">${esc(ref)}</dd>
        <dt>התקבלה</dt><dd>${esc(fmtCreated(o))}</dd>
        <dt>טלפון</dt><dd class="ltr">${esc(o.contact)}</dd>
        <dt>מסגרת</dt><dd>${esc(o.competitionLabel)}</dd>
        <dt>אצטדיון</dt><dd>${esc(o.venue)}</dd>
        <dt>שידור</dt><dd>${bc}</dd>
        <dt>סגנון</dt><dd>${esc(style ? `${style.code} ${style.en} (${style.he})` : o.styleName)}</dd>
        <dt>לוגו קבוצה</dt><dd>${lg(L.team)}</dd>
        <dt>לוגו יריבה</dt><dd>${lg(L.opponent)}</dd>
        <dt>לוגו מסגרת</dt><dd>${L.competition.inDrive ? `<span class="ok">נמצא</span> <bdi dir="ltr">${esc(L.competition.file)}</bdi>` : `<span class="warn">חסר ב-Drive: <bdi dir="ltr">${esc(L.competition.file)}</bdi></span>`}</dd>
        <dt>הרכב תמונות</dt><dd>${esc(layout ? layout.he : o.photoLayout)}</dd>
        <dt>הערות</dt><dd>${o.notes ? esc(o.notes) : '-'}</dd>
      </dl>
      <div class="photos" data-photos="${esc(o.id)}"><span class="loading">${open ? 'טוענים תמונות…' : ''}</span></div>
      <div class="actions">
        <button class="btn" type="button" data-act="copy" data-id="${esc(o.id)}">העתקת פרומפט</button>
        <button class="btn" type="button" data-act="zip" data-id="${esc(o.id)}">הורדת תיקייה (ZIP)</button>
        <a class="btn ghost" href="${wa}" target="_blank" rel="noopener">וואטסאפ ללקוח</a>
        <span class="grow"></span>
        <label class="sr" for="st-${esc(o.id)}">סטטוס</label>
        <select id="st-${esc(o.id)}" data-act="status" data-id="${esc(o.id)}">
          ${STATUSES.map((s) => `<option value="${s.id}" ${s.id === o.status ? 'selected' : ''}>${esc(s.he)}</option>`).join('')}
        </select>
        <button class="btn danger" type="button" data-act="delete" data-id="${esc(o.id)}">מחיקה</button>
      </div>
      <details class="prompt"><summary>הצגת הפרומפט</summary><pre>${open ? esc(buildPrompt(o)) : ''}</pre></details>
    </div>
  </details>`;
}

function render() {
  renderChips();
  const list = sortOrders([...state.orders.values()].filter((o) => state.filter === 'all' || o.status === state.filter));
  $('#orders').innerHTML = list.length
    ? list.map(orderHTML).join('')
    : `<div class="empty">${state.orders.size ? 'אין הזמנות בסטטוס הזה.' : 'עדיין אין הזמנות. כשתגיע הזמנה היא תופיע כאן מיד.'}</div>`;
  state.open.forEach((id) => { if (state.orders.has(id)) paintPhotos(id); });
}

/* ---------- תמונות ---------- */
async function loadPhotos(id) {
  if (state.photos.has(id)) return state.photos.get(id);
  const { fs, db } = state;
  const snap = await fs.getDocs(fs.collection(db, 'orders', id, 'photos'));
  const arr = snap.docs
    .sort((a, b) => Number(a.id) - Number(b.id))
    .map((d) => ({ idx: Number(d.id), ...d.data() }));
  state.photos.set(id, arr);
  return arr;
}
async function paintPhotos(id) {
  const box = document.querySelector(`[data-photos="${CSS.escape(id)}"]`);
  if (!box) return;
  try {
    const photos = await loadPhotos(id);
    const again = document.querySelector(`[data-photos="${CSS.escape(id)}"]`);
    if (!again) return;
    again.replaceChildren();
    photos.forEach((p) => {
      const a = document.createElement('a');
      a.href = `data:image/jpeg;base64,${p.data}`;
      a.target = '_blank';
      a.rel = 'noopener';
      const img = document.createElement('img');
      img.src = a.href;
      img.alt = `תמונה ${p.idx + 1}`;
      a.appendChild(img);
      again.appendChild(a);
    });
    if (!photos.length) again.textContent = 'אין תמונות להצגה.';
  } catch (e) { console.error(e); box.textContent = 'לא הצלחנו לטעון את התמונות.'; }
}

/* ---------- פעולות ---------- */
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; }
  catch (_) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand('copy');
    ta.remove();
    return ok;
  }
}
const safeName = (s) => String(s).replace(/[\\/:*?"<>|\u0000-\u001f]/g, '').replace(/\s+/g, '-').slice(0, 40) || 'order';

async function downloadZip(o, btn) {
  if (typeof JSZip === 'undefined') { toast('רכיב ה-ZIP לא נטען. רעננו את הדף.'); return; }
  const old = btn.textContent;
  btn.disabled = true; btn.textContent = 'מכינים…';
  try {
    const photos = await loadPhotos(o.id);
    const ref = o.id.slice(0, 6).toUpperCase();
    const zip = new JSZip();
    const folder = `MATCHDAY-${safeName(o.player)}-${ref}`;
    zip.file(`${folder}/prompt.txt`, buildPrompt(o));
    zip.file(`${folder}/order-details.txt`, buildDetails(o, ref));
    photos.forEach((p) => zip.file(`${folder}/photo-${p.idx + 1}.jpg`, p.data, { base64: true }));
    const blob = await zip.generateAsync({ type: 'blob' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `${folder}.zip`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  } catch (e) { console.error(e); toast('יצירת ה-ZIP נכשלה'); }
  finally { btn.disabled = false; btn.textContent = old; }
}

async function deleteOrder(o) {
  if (!confirm(`למחוק את ההזמנה של ${o.player}? הפרטים והתמונות יימחקו לצמיתות.`)) return;
  try {
    const { fs, db } = state;
    const snap = await fs.getDocs(fs.collection(db, 'orders', o.id, 'photos'));
    const batch = fs.writeBatch(db);
    snap.docs.forEach((d) => batch.delete(d.ref));
    batch.delete(fs.doc(db, 'orders', o.id));
    await batch.commit();
    state.photos.delete(o.id); state.open.delete(o.id);
    toast('ההזמנה נמחקה');
  } catch (e) { console.error(e); toast('המחיקה נכשלה'); }
}

$('#sortSel').value = state.sort;
$('#sortSel').addEventListener('change', (e) => {
  state.sort = e.target.value === 'new' ? 'new' : 'game';
  try { localStorage.setItem('md_sort', state.sort); } catch (_) {}
  render();
});

$('#chips').addEventListener('click', (e) => {
  const b = e.target.closest('[data-filter]');
  if (!b) return;
  state.filter = b.dataset.filter;
  render();
});

$('#orders').addEventListener('toggle', (e) => {
  const d = e.target;
  if (!d.classList || !d.classList.contains('order')) return;
  const id = d.dataset.id;
  if (d.open) {
    state.open.add(id);
    const o = state.orders.get(id);
    const pre = d.querySelector('details.prompt pre');
    if (o && pre && !pre.textContent) pre.textContent = buildPrompt(o);
    paintPhotos(id);
  } else state.open.delete(id);
}, true);

$('#orders').addEventListener('click', async (e) => {
  const btn = e.target.closest('button[data-act]');
  if (!btn) return;
  const o = state.orders.get(btn.dataset.id);
  if (!o) return;
  if (btn.dataset.act === 'copy') toast((await copyText(buildPrompt(o))) ? 'הפרומפט הועתק' : 'ההעתקה נכשלה');
  else if (btn.dataset.act === 'zip') downloadZip(o, btn);
  else if (btn.dataset.act === 'delete') deleteOrder(o);
});

$('#orders').addEventListener('change', async (e) => {
  const sel = e.target.closest('select[data-act=status]');
  if (!sel) return;
  try {
    const { fs, db } = state;
    await fs.updateDoc(fs.doc(db, 'orders', sel.dataset.id), { status: sel.value });
  } catch (err) { console.error(err); toast('עדכון הסטטוס נכשל'); }
});

init();
</script>
</body>
</html>
